	padding: 0;
	border: 0;
}

body {

	background-color: #1a1109;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#loader {
	position: fixed;
	inset: 0;
	z-index: 10;
	display: flex;
	flex-direction: column;
	justify-content: flex-end;
	align-items: center;
	background: #1a1109 url('index.loading_land.webp') center / cover no-repeat;
	transition: opacity 0.4s ease;
}

@media (orientation: portrait) {
	#loader {
		background-image: url('index.loading_tall.webp');
	}
}

#loader.gone {
	opacity: 0;
	pointer-events: none;
}

#load-box {
	width: min(560px, 82vw);
	margin-bottom: max(7vh, 32px);
	padding: 14px 18px 12px;
	background: rgba(26, 15, 7, 0.78);
	border: 1px solid #b58b4c;
	border-radius: 10px;
	box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
}

#load-bar {
	height: 14px;
	border-radius: 7px;
	background: #3b2410;
	border: 1px solid #6b4a2a;
	overflow: hidden;
}

#load-fill {
	width: 0;
	height: 100%;
	background: linear-gradient(#f7dc98, #c9952e);
	transition: width 0.2s linear;
}

#load-bar.wait #load-fill {
	width: 30%;
	animation: load-wait 1.4s ease-in-out infinite alternate;
}

@keyframes load-wait {
	from { margin-left: 0; }
	to { margin-left: 70%; }
}

#load-text {
	margin-top: 8px;
	min-height: 1.2em;
	text-align: center;
	font: 600 16px/1.2 Georgia, 'Times New Roman', serif;
	font-variant-numeric: tabular-nums;
	letter-spacing: 0.02em;
}

#load-notice {
	display: none;
	margin-top: 10px;
	color: #ffc2b4;
	font: 14px/1.35 system-ui, sans-serif;
	text-align: center;
	white-space: pre-line;
}
