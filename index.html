html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

		<script>
// web_boot.js — загрузчик веб-сборки «Кальдеры»: выполняется до движка (tools/web_boot.py вставляет его в
// build/web/index.html перед index.js). Об игре ничего не знает; состояние — в window.__caldera_boot.
//   dpr_cap — потолок плотности пикселей (масштаб рендера): 0 — без потолка. Параметр ссылки dpr=1.5.
//             Движок перечитывает window.devicePixelRatio каждый кадр, поэтому потолок можно менять на ходу.
//   shim    — "on" (по умолчанию): на запрос WebGL «включён ли SCISSOR_TEST» отвечает копия состояния, без
//             синхронного обращения к процессу видеокарты (движок спрашивает это каждый кадр перед выводом на
//             экран); "off" (shim=0) — как в движке; "check" (shim=check) — отвечает из копии и сверяет её
//             с настоящим ответом: shim_asked — спрошено, shim_mismatch — расхождений.
//   pdb     — true: буфер холста сохраняется между кадрами, как просит движок (preserveDrawingBuffer);
//             false (pdb=0) — контекст просят без сохранения: браузеру не нужна лишняя копия кадра.
//             Поле показывает, что запрошено; что получилось — getContextAttributes() контекста.
//   hz      — частота кадров браузера при загрузке страницы (оценка частоты экрана), 0 — ещё не измерена.
(function () {
	'use strict';
	var SCISSOR_TEST = 0x0C11;
	var HZ_FRAMES = 120;
	var HZ_COMMON = [60, 90, 120, 144];
	var HZ_SNAP = 0.07;
	var OFF = ['0', 'off', 'false'];
	var params = new URLSearchParams(window.location.search);
	var own = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio')
		|| Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'devicePixelRatio');
	var startDpr = window.devicePixelRatio || 1;
	function realDpr() {
		return own && own.get ? own.get.call(window) || 1 : startDpr;
	}
	var shimParam = (params.get('shim') || '').toLowerCase();
	var boot = {
		dpr_cap: 0,
		dpr_override: false,
		shim: OFF.indexOf(shimParam) >= 0 ? 'off' : (shimParam === 'check' ? 'check' : 'on'),
		shim_asked: 0,
		shim_mismatch: 0,
		pdb: OFF.indexOf((params.get('pdb') || '').toLowerCase()) < 0,
		hz: 0,
	};
	Object.defineProperty(boot, 'dpr_real', { enumerable: true, get: realDpr });
	Object.defineProperty(boot, 'dpr', { enumerable: true, get: function () { return window.devicePixelRatio; } });
	var cap = parseFloat((params.get('dpr') || '').replace(',', '.'));
	if (cap >= 0.5 && cap <= 4) {
		boot.dpr_cap = cap;
	}
	try {
		Object.defineProperty(window, 'devicePixelRatio', {
			configurable: true,
			enumerable: true,
			get: function () {
				var real = realDpr();
				return boot.dpr_cap > 0 ? Math.min(real, boot.dpr_cap) : real;
			},
			set: function () {},
		});
		boot.dpr_override = true;
	} catch (e) {
		boot.dpr_override = false;
	}

	if (boot.shim !== 'off' && window.WebGL2RenderingContext) {
		var proto = window.WebGL2RenderingContext.prototype;
		var enable = proto.enable;
		var disable = proto.disable;
		var getParameter = proto.getParameter;
		var scissor = new WeakMap();
		proto.enable = function (capability) {
			if (capability === SCISSOR_TEST) {
				scissor.set(this, true);
			}
			return enable.call(this, capability);
		};
		proto.disable = function (capability) {
			if (capability === SCISSOR_TEST) {
				scissor.set(this, false);
			}
			return disable.call(this, capability);
		};
		proto.getParameter = function (pname) {
			if (pname !== SCISSOR_TEST) {
				return getParameter.call(this, pname);
			}
			var shadow = scissor.get(this) === true;
			if (boot.shim === 'check') {
				boot.shim_asked += 1;
				if (getParameter.call(this, pname) !== shadow) {
					boot.shim_mismatch += 1;
				}
			}
			return shadow;
		};
		// Восстановленный контекст начинает с состояния по умолчанию — его копия тоже.
		document.addEventListener('webglcontextrestored', function (event) {
			try {
				scissor.delete(event.target.getContext('webgl2'));
			} catch (e) {
				scissor = new WeakMap();
			}
		}, true);
	} else {
		boot.shim = 'off';
	}

	if (!boot.pdb) {
		var getContext = HTMLCanvasElement.prototype.getContext;
		HTMLCanvasElement.prototype.getContext = function (type, attributes) {
			if ((type === 'webgl2' || type === 'webgl') && attributes && attributes.preserveDrawingBuffer) {
				attributes = Object.assign({}, attributes, { preserveDrawingBuffer: false });
			}
			return getContext.call(this, type, attributes);
		};
	}

	var deltas = [];
	var last = 0;
	function tick(now) {
		if (last > 0) {
			deltas.push(now - last);
		}
		last = now;
		if (deltas.length < HZ_FRAMES) {
			window.requestAnimationFrame(tick);
			return;
		}
		deltas.sort(function (a, b) { return a - b; });
		var fast = deltas[Math.floor(deltas.length / 10)];
		var hz = fast > 0 ? 1000 / fast : 0;
		for (var i = 0; i < HZ_COMMON.length; i++) {
			if (Math.abs(hz - HZ_COMMON[i]) <= HZ_COMMON[i] * HZ_SNAP) {
				hz = HZ_COMMON[i];
			}
		}
		boot.hz = Math.round(hz);
	}
	window.requestAnimationFrame(tick);

	window.__caldera_boot = boot;
})();
		</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":574896,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
