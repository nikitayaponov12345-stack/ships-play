	margin: 0;
	padding: 0;

body {

	background-color: #1a1109;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#loader {
	position: fixed;
	inset: 0;
	z-index: 10;
	display: flex;
	flex-direction: column;
	justify-content: flex-end;
	align-items: center;
	background: #1a1109 url('index.loading_land.webp') center / cover no-repeat;
	transition: opacity 0.4s ease;
}

@media (orientation: portrait) {
	#loader {
		background-image: url('index.loading_tall.webp');
	}
}

#loader.gone {
	opacity: 0;
	pointer-events: none;
}

#load-box {
	width: min(560px, 82vw);
	margin-bottom: max(7vh, 32px);
	padding: 14px 18px 12px;
	background: rgba(26, 15, 7, 0.78);
	border: 1px solid #b58b4c;
	border-radius: 10px;
	box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
}

#load-bar {
	height: 14px;
	border-radius: 7px;
	background: #3b2410;
	border: 1px solid #6b4a2a;
	overflow: hidden;
}

#load-fill {
	width: 100%;
	height: 100%;
	background: linear-gradient(#f7dc98, #c9952e);
	transform: scaleX(0);
	transform-origin: left center;
	will-change: transform;
	transition: transform 0.2s linear;
}

#load-bar.wait #load-fill {
	width: 30%;
	transition: none;
	animation: load-wait 1.4s ease-in-out infinite alternate;
}

@keyframes load-wait {
	from { transform: translateX(0); }
	to { transform: translateX(233.3%); }
}

#load-text {
	margin-top: 8px;
	min-height: 1.2em;
	text-align: center;
	font: 600 16px/1.2 Georgia, 'Times New Roman', serif;
	font-variant-numeric: tabular-nums;
	letter-spacing: 0.02em;
}

#load-canvas {
	display: block;
	width: 100%;
	height: 42px;
}

#load-canvas[hidden] {
	display: none;
}

#load-notice {
	display: none;
	margin-top: 10px;
	color: #ffc2b4;
	font: 14px/1.35 system-ui, sans-serif;
	text-align: center;
	white-space: pre-line;
}

		tell({ t: 'mark', key: key });
	}

	// M8-477: шаги этого запуска — в память устройства: метка и сколько шёл шаг.
	function saveSteps() {
		let from = load.launch_at;
		const steps = stepTimes.map((step) => {
			const spent = Math.max(1, Math.round(step[1] - from));
			from = step[1];
			return [step[0], spent];
		});
		if (!stepsFit(steps)) {
			return;
		}
		try {
			window.localStorage.setItem(STEPS_KEY, JSON.stringify(steps));
		} catch (e) {
			load.stored = false;
		}
	}

	// Счёт байт ответа response на файл name по ходу чтения его тела; возвращает тело со счётом.
	function tracked(name, response) {
		const encoding = (response.headers.get('content-encoding') || '').toLowerCase();
		const length = Number(response.headers.get('content-length')) || 0;
		const raw = Number(RAW[name]) || 0;
		const wire = length || (encoding ? guess(name, encoding, raw) : raw);
		let got = 0;
		const reader = response.body.getReader();
		return new ReadableStream({
			pull(controller) {
				return reader.read().then(({ done, value }) => {
					if (done) {
						controller.close();
						return;
					}
					got += value.byteLength;
					count(name, got, wire);
					controller.enqueue(value);
				});
			},
			cancel(reason) {
				return reader.cancel(reason);
			},
		});
	}

	// Ответы на файлы загрузки движка: размер в сети — из заголовков, пришедшие байты — по ходу чтения тела.
	// M8-478: index.wasm движку — пустой ответ (он лишь ждёт начала ответа), сборщику браузера — настоящий
	// (instantiateStreaming ниже), счёт байт — по его копии.
	const nativeFetch = window.fetch.bind(window);
	window.fetch = function (input, init) {
		const url = typeof input === 'string' ? input : (input && input.url) || '';
		const name = decodeURIComponent(String(url).split('?')[0].split('/').pop());
		if (!(name in RAW)) {
			return nativeFetch(input, init);
		}
		return nativeFetch(input, init).then((response) => {
			if (!response.ok || !response.body) {
				return response;
			}
			if (name === wasm && streaming) {
				wasmReal = response;
				const reader = tracked(name, response.clone()).getReader();
				const drain = () => reader.read().then(({ done }) => (done ? null : drain()));
				drain().catch(() => {});
				return new Response(new Uint8Array(0), { status: 200,
					headers: { 'content-type': 'application/wasm' } });
			}
			return new Response(tracked(name, response), { status: response.status, statusText: response.statusText,
				headers: response.headers });
		});
	};
	// M8-478: сборщик браузера получает настоящий ответ сети — собранный код движка ложится в кэш браузера. Сервер
	// отдал wasm не тем типом — потоковая сборка такой ответ не берёт: то же тело под нужным типом (без кэша кода).
	const nativeInstantiate = WebAssembly.instantiateStreaming;
	if (streaming) {
		WebAssembly.instantiateStreaming = function (source, imports) {
			WebAssembly.instantiateStreaming = nativeInstantiate;
			if (!wasmReal) {
				return nativeInstantiate.call(WebAssembly, source, imports);
			}
			const typed = (wasmReal.headers.get('content-type') || '').toLowerCase().startsWith('application/wasm');
			return nativeInstantiate.call(WebAssembly, typed ? wasmReal : new Response(wasmReal.body,
				{ status: wasmReal.status, headers: { 'content-type': 'application/wasm' } }), imports);
		};
	}

	// M8-477: поток страницы (Web Worker). Ответил «готов» — пакеты старта качает он; а где можно (CANVAS_OK и
	// OffscreenCanvas), он же рисует шкалу и надпись на холсте, страница свои прячет. Не ответил до запуска движка
	// (запрет площадки, старый браузер) — всё делает страница.
	function canvasSize() {
		const box = dom.hidden ? canvas : dom;
		return { w: Math.max(1, Math.round(box.getBoundingClientRect().width)), h: CANVAS_H,
			dpr: Math.min(3, window.devicePixelRatio || 1) };
	}

	function startWorker() {
		if (!window.Worker) {
			return;
		}
		let helper = null;
		try {
			const source = [LoadModel, LoadPainter, loadWorker].map(String).join('\n') + '\nloadWorker(self);';
			helper = new Worker(URL.createObjectURL(new Blob([source], { type: 'text/javascript' })));
		} catch (e) {
			return;
		}
		helper.onmessage = function (event) {
			const d = event.data;
			if (d.t === 'ready' && !worker && !launched) {
				worker = helper;
				load.worker = true;
				if (!CANVAS_OK || !window.OffscreenCanvas || !canvas.transferControlToOffscreen) {
					helper.postMessage({ t: 'init', canvas: null, ru: ru });
					return;
				}
				const size = canvasSize();
				const off = canvas.transferControlToOffscreen();
				drawn = true;
				load.mode = 'canvas';
				helper.postMessage({ t: 'init', canvas: off, ru: ru, w: size.w, h: size.h, dpr: size.dpr }, [off]);
				for (const name in declared) { // поток узнаёт всё, что уже объявлено и уже пришло
					helper.postMessage({ t: 'file', name: name, raw: declared[name][0], wire: declared[name][1],
						need: declared[name][2] });
					if (counted[name]) {
						helper.postMessage({ t: 'got', name: name, got: counted[name][0], wire: counted[name][1] });
					}
				}
				canvas.hidden = false;
				dom.hidden = true;
			} else if (d.t === 'got') {
				firstGot(d.name, d.got, d.wire);
			} else if (d.t === 'file') {
				load.first_wall = Math.max(load.first_wall || 0, d.at); // когда пакет старта пришёл (часы Date.now)
				firstGot(d.name, d.got, d.wire);
				firstDone(d.name, d.buffer);
			} else if (d.t === 'fail') {
				firstFailed(d.name);
			}
		};
		helper.onerror = function () {
			if (worker === helper) { // поток упал уже в работе: пакеты старта, что он качал, игра заберёт сама
				for (const name in firstJobs) {
					if (firstJobs[name].state === 'loading' && !firstJobs[name].buffer) {
						firstFailed(name);
					}
				}
			}
		};
		window.addEventListener('resize', () => {
			const size = canvasSize();
			tell({ t: 'size', w: size.w, h: size.h, dpr: size.dpr });
		});
	}

	// M8-477: пакеты старта. Файл name: пришло got байт; пришёл целиком (buffer); не пришёл.
	const declared = {}; // имя → [raw, wire, need] — всё, что объявлено счёту (потоку — когда он будет готов)
	const counted = {}; // имя → [got, wire] — сколько уже пришло у файлов, что качает страница
	function firstGot(name, got, wire) {
		if (firstJobs[name]) {
			firstJobs[name].got = got;
		}
		model.got(name, got, wire);
		paint();
	}

	function firstDone(name, buffer) {
		const job = firstJobs[name];
		if (job && job.state === 'loading' && !job.buffer) {
			job.buffer = buffer;
			window.__caldera_packs.settle(job);
			firstLeft -= 1;
		}
	}

	function firstFailed(name) {
		const job = firstJobs[name];
		if (job && job.state === 'loading' && !job.buffer) {
			job.state = 'failed';
			firstLeft -= 1;
			model.drop(name);
			tell({ t: 'file', name: name, raw: 0, wire: 0, need: false });
		}
	}

	// Пакеты старта — качать: поток страницы, если он есть, иначе сама страница (тогда они придут после запуска).
	function fetchFirst() {
		CALDERA_FIRST.forEach((item) => {
			const name = String(item.file).split('/').pop();
			const url = new URL(item.file, document.baseURI).href;
			if (worker) {
				firstJobs[name] = window.__caldera_packs.adopt(name);
				post({ t: 'fetch', name: name, url: url, size: Number(item.size) || 0 });
				return;
			}
			const job = firstJobs[name] = window.__caldera_packs.adopt(name, window.__caldera_packs.load(url,
				Number(item.size) || 0));
			const watch = setInterval(() => {
				model.got(name, job.got, 0);
				paint();
				if (job.state !== 'loading' || job.buffer) {
					clearInterval(watch);
					firstLeft -= 1;
					if (job.state === 'failed') {
						model.drop(name);
					}
				}
			}, 100);
		});
	}

	// M8-459, M8-477: пришло всё, без чего движок не запустить. Шкалу на холсте поток страницы ведёт сам (шаги запуска
	// и мегабайты пакетов старта). Шкала страницы, пока движок запускается, стоять не должна, а страница в это время
	// не работает — её ведёт анимация браузера длиной во время запуска с запасом: всё пришло — к TAIL, плавно
	// замедляясь; пакеты старта ещё идут — ровно, туда, куда мегабайты дойдут за это время при нынешней скорости сети.
	// Надпись страницы на время запуска — «Запускаем игру…»: мегабайты она в это время считать не может (число стояло
	// бы на месте), после запуска — снова по счёту.
	function launch() {
		if (launched) {
			return;
		}
		launched = true;
		const pace = startSeconds * 1000 / model.totalRef;
		model.launch(performance.now(), pace, ownSteps);
		tell({ t: 'launch', pace: pace, steps: ownSteps });
		if (!drawn) {
			const view = model.view(performance.now());
			const spent = Math.max(0.05, (performance.now() - firstByte) / 1000);
			const seconds = startSeconds * LAUNCH_STRETCH;
			domShare = view.loaded ? TAIL : Math.min(TAIL, view.share * (1 + seconds / spent));
			busy = true;
			bar.classList.remove('wait');
			setShare(domShare, seconds, view.loaded ? LAUNCH_EASE : 'linear');
			text.textContent = model.launchText;
		}
		load.launch_at = performance.now();
		load.launch_wall = Date.now();
	}

	// Движок запустился: шкала страницы — с места, до которого дошла анимация запуска (её цель могла быть дальше).
	// Место читается в следующем кадре браузера: в задаче, где шёл запуск, часы анимаций страницы стоят на его начале
	// (шкала прыгнула бы назад).
	function launchDone() {
		if (drawn) {
			busy = false;
			return;
		}
		window.requestAnimationFrame(() => {
			try {
				domShare = Math.min(domShare, new DOMMatrixReadOnly(window.getComputedStyle(fill).transform).a);
			} catch (e) {
				load.matrix = false;
			}
			busy = false;
			paint();
		});
	}

	// M8-459: промис — через n кадров браузера (анимация шкалы уже передана потоку композиции).
	function frames(n) {
		return new Promise((resolve) => {
			const step = () => (n-- <= 0 ? resolve() : window.requestAnimationFrame(step));
			window.requestAnimationFrame(step);
		});
	}

	function hide() {
		if (loader.classList.contains('gone')) {
			return;
		}
		if (!drawn) {
			setShare(1, 0.15, 'linear'); // M8-390: первый экран открыт — шкала полная
			text.textContent = model.view(performance.now()).text;
		}
		loader.classList.add('gone');
		setTimeout(() => {
			if (worker) { // пакеты старта уже у страницы — поток больше не нужен
				worker.terminate();
				worker = null;
			}
			loader.remove();
		}, 600);
	}

	// Игра открыла первый экран (главное меню или сцена дымового прогона) и пакеты старта скачаны — страница загрузки
	// уходит. Экрана нет дольше HIDE_AFTER_MS после запуска — уходит и так; пакеты старта ещё идут — ждёт их
	// (мегабайты на шкале), не пришли — игра заберёт их сама.
	function waitScene() {
		const started = performance.now();
		const timer = setInterval(() => {
			const state = window.__caldera;
			const scene = !!(state && state.scene);
			if (scene && !load.scene_at) {
				load.scene_at = performance.now();
				load.scene_wall = Date.now();
				mark('scene');
				saveSteps();
			}
			if ((scene || performance.now() - started > HIDE_AFTER_MS) && firstLeft <= 0) {
				clearInterval(timer);
				load.shown_at = performance.now();
				hide();
			}
		}, 100);
	}

	function fail(err) {
		console.error(err);
		const message = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'An unknown error occurred.');
		canvas.hidden = true;
		dom.hidden = false;
		bar.style.display = 'none';
		text.style.display = 'none';
		notice.textContent = message;
		notice.style.display = 'block';
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});
	if (missing.length !== 0) {
		fail('Error\nThe following features required to run Godot projects on the Web are missing:\n'
			+ missing.join('\n'));
		return;
	}
	window.__caldera_print = function (line) {
		for (let i = 0; i < PRINTS.length; i++) {
			if (line.indexOf(PRINTS[i][0]) >= 0) {
				mark(PRINTS[i][1]);
			}
		}
	};
	for (const name in RAW) {
		declared[name] = [Number(RAW[name]) || 0, guess(name, '', Number(RAW[name]) || 0), true];
	}
	CALDERA_FIRST.forEach((item) => {
		const name = String(item.file).split('/').pop();
		declared[name] = [Number(item.size) || 0, guess(item.file, '', Number(item.size) || 0), false];
	});
	for (const name in declared) {
		model.file(name, declared[name][0], declared[name][1], declared[name][2]);
	}
	firstLeft = CALDERA_FIRST.length;
	startWorker();
	// M8-459: как engine.startGame, но между загрузкой и запуском — шкала и два кадра браузера. M8-477: пришли
	// index.wasm и index.pck — пакеты старта начинают качаться, движок запускается.
	Promise.all([engine.init(exe), engine.preloadFile(pack, pack)]).then(() => {
		window.fetch = nativeFetch;
		paint();
		fetchFirst();
		launch();
		return frames(2);
	}).then(() => engine.start({ 'args': ['--main-pack', pack].concat(GODOT_CONFIG['args'] || []) })).then(() => {
		launchDone();
		waitScene();
	}, fail);
}());
		</script>
	</body>
</html>
